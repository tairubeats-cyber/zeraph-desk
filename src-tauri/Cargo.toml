[package]
name = "zeraph-desk"
version = "0.1.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# v1 mail path: app password, no OAuth.
imap = "3.0.0-alpha.15"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
mail-parser = "0.9"
keyring = "3"
# SimpleFIN: the bridge is called from Rust so its access URL never reaches the webview.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
url = "2"
base64 = "0.22"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# keyring 3 has no default credential store: without a platform feature it silently uses an
# in-memory mock, and the app password would vanish when the app closes. Each OS needs its own.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
