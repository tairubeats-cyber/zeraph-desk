name: Build installers

# Produces the Windows installer and a universal macOS disk image (Apple Silicon and Intel in one).
#
#   - Push a tag like v0.1.0 to build both and attach them to a draft GitHub release.
#   - Or run it by hand from the Actions tab ("Run workflow") to build both and download the files
#     from the run's Artifacts, without making a release.
#
# Not on every push: a macOS build is billed at ten times the Windows rate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # only used to create the draft release on a tag build

jobs:
  build:
    strategy:
      fail-fast: false # if one platform breaks, still get the other
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      # The address of the deployed proxy. It's public (it's in the app's own network allow-list), so it lives here
      # rather than in a secret. A local .env isn't in the repo, so without this the packaged app would have no address.
      VITE_ZERAPH_API: https://zeraph-api.zeraph-api.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only a tag build creates a release; a manual run just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Zeraph Desk {0}', github.ref_name) || '' }}
          releaseBody: "Windows: run the setup file. Mac: open the disk image and drag Zeraph Desk to Applications. See INSTALL.md for the one-time security prompts."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Always keep the files as a downloadable artifact too, so a manual run has something to download.
      - uses: actions/upload-artifact@v4
        with:
          name: zeraph-desk-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
